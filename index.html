<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kevin Kiprotich’s personal website." />
    <link rel="canonical" href="https://kevinkipro.com/" />
    <link rel="stylesheet" href="/styles.css" />
    <script>document.documentElement.classList.add("has-js");</script>
    <script src="/script.js" defer></script>
    <title>Kevin Kiprotich</title>
  </head>
  <body class="home-page">
    <div class="intro-screen" data-intro-screen>
      <button
        class="intro-trigger"
        type="button"
        aria-label="Enter Kevin Kiprotich’s website"
        aria-controls="site-content"
        aria-expanded="false"
        data-intro-trigger
      >
        <span class="intro-wordmark" aria-hidden="true" data-intro-wordmark>
          <span data-intro-name></span><span class="intro-caret"></span>
        </span>
      </button>
    </div>

    <div class="site-shell" id="site-content" data-site-content>
      <a class="skip-link" href="#main-content">Skip to content</a>

      <header class="site-header">
        <div class="site-header-inner">
          <a class="site-name" href="/" aria-label="Kevin Kiprotich, home">Kevin Kiprotich</a>
          <nav aria-label="Primary navigation">
            <a href="/" aria-current="page">Home</a>
            <a href="/writing/">Writing</a>
            <a href="/about/">About</a>
          </nav>
        </div>
      </header>

      <main id="main-content">
        <h1 class="visually-hidden">Kevin Kiprotich</h1>
      </main>
    </div>
  </body>
</html>
